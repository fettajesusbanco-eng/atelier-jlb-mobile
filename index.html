<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Atelier JLB Mobile : catalogue musical, playlists, descriptions, studio et boutique Gumroad locale.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atelier JLB">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Atelier JLB Mobile</title>
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand" aria-label="Atelier JLB Mobile">
        <div class="brand-icon">JLB</div>
        <div><strong>ATELIER JLB</strong><small>Mobile · espace de travail</small></div>
      </div>
      <div class="topactions">
        <button id="voiceButton" class="icon-button" aria-label="Commande vocale" title="Commande vocale"><span aria-hidden="true">🎙️</span></button>
        <button id="settingsButton" class="icon-button" aria-label="Réglages" title="Réglages"><span aria-hidden="true">⚙️</span></button>
      </div>
    </header>
    <main id="main" tabindex="-1" class="content"></main>
    <nav class="tabbar" aria-label="Navigation principale">
      <button type="button" data-page="home"><span aria-hidden="true">⌂</span><small>Accueil</small></button>
      <button type="button" data-page="playlists"><span aria-hidden="true">☷</span><small>Playlists</small></button>
      <button type="button" data-page="descriptions"><span aria-hidden="true">✎</span><small>Textes</small></button>
      <button type="button" data-page="tools"><span aria-hidden="true">▦</span><small>Outils</small></button>
      <button type="button" data-page="gumroad"><span aria-hidden="true">▣</span><small>Boutique</small></button>
      <button type="button" data-page="data"><span aria-hidden="true">⇩</span><small>Données</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input hidden type="file" id="importInput" accept=".csv,.json,.txt,text/csv,application/json">
  <script src="./app.js" defer></script>
</body>
</html>
